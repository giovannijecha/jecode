name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm / ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release-tag -- "$RELEASE_TAG"

      - name: Run release gates
        run: npm run check

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
