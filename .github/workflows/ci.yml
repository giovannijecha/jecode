name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out public source
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git remote add origin "https://github.com/$env:SOURCE_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          git fetch --depth=1 origin $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
      - name: Provision pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust provisioning failed' }
      - name: Reject dependencies before compilation
        run: |
          $graph = @(cargo tree --locked --offline --all-features --target all --edges normal,build,dev --prefix none)
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inspection failed' }
          if ($graph.Count -ne 1 -or $graph[0] -notmatch '^jecode v[^ ]+ \(') { throw 'External or unexpected package in Cargo graph' }
      - name: Provision pinned portable PowerShell for Windows runner tests
        if: runner.os == 'Windows'
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'jecode-pwsh-7.6.6'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $archive = Join-Path $fixture 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          # Published at https://github.com/PowerShell/PowerShell/discussions/27990
          $expected = '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expected) { throw 'Portable PowerShell archive hash mismatch' }
          $portable = Join-Path $fixture 'portable'
          Expand-Archive -LiteralPath $archive -DestinationPath $portable
          $executable = Join-Path $portable 'pwsh.exe'
          if ((& $executable -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()') -ne '7.6.6') { throw 'Unexpected portable PowerShell version' }
          "JECODE_TEST_PWSH=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify native source
        run: |
          cargo run --locked --offline --bin jecode-check -- check
          if ($LASTEXITCODE -ne 0) { throw 'Native checks failed' }
          cargo build --locked --offline --release --bin jecode
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
