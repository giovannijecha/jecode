name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Enforce zero runtime dependencies
        run: node -e "const p = require('./package.json'); if (Object.keys(p.dependencies ?? {}).length !== 0) throw new Error('package.json dependencies must stay empty')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gates
        run: npm run coverage

      - name: Verify release package
        run: npm run check:package
