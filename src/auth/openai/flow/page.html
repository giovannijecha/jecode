<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jecode sign-in</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1e1e;
      color: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      padding: 36px;
      background: #282e39;
      border: 1px solid #3a4452;
      border-radius: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 28px;
      border-bottom: 1px solid #3a4452;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .mark {
      color: #7aa2f7;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.08em;
    }

    h1 {
      margin: 30px 0 12px;
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    p {
      max-width: 34ch;
      margin: 0;
      color: #9aa4b2;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    @media (max-width: 420px) {
      main { padding: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand"><span class="mark" aria-hidden="true">&gt;_</span><span>Jecode</span></header>
    <h1>{{HEADING}}</h1>
    <p>{{DESCRIPTION}}</p>
  </main>
</body>
</html>
